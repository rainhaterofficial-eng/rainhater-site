# nginx site config for rainhater.com (static files)
server {
    listen 80;
    listen [::]:80;
    server_name rainhater.com www.rainhater.com;

    root /var/www/rainhater;
    index index.html;

    # Basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Let images, styles and scripts be cached by browsers for a week
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|gif|ico|woff2?|mp3|mp4)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Never serve git or deploy files
    location ~ /\.(?!well-known) { deny all; }
    location ^~ /deploy/ { deny all; }
    location ~ \.md$ { deny all; }

    error_page 404 /404.html;
}
